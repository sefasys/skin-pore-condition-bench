[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porecondition-bench"
version = "0.1.0"
description = "Reproducible deep-learning benchmark for facial pore-condition preprocessing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PoreCondition-Bench contributors"}]
keywords = ["deep-learning", "medical-imaging", "computer-vision", "convnext", "preprocessing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pore-prepare = "pore_assessment.prepare:main"
pore-preprocessing-audit = "pore_assessment.preprocessing_audit:main"
pore-preprocessing-cache = "pore_assessment.preprocessing_cache:main"
pore-train = "pore_assessment.train:main"
pore-report = "pore_assessment.report:main"
pore-summarize = "pore_assessment.study_summary:main"
pore-pipeline = "pore_assessment.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
